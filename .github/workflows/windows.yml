name: Windows

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.bat'
      - 'requirements*.txt'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.bat'
      - 'requirements*.txt'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar requisitos de prueba
        run: python -m pip install -r requirements.txt
      - name: Exigir una ventana Tk real
        run: python -c "import tkinter as tk; r=tk.Tk(); r.update(); assert r.winfo_viewable(); print('Tk visible', r.tk.call('info', 'patchlevel')); r.destroy()"
      - name: Comprobar manifiesto y archivos BAT del ZIP
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          for line in Path('MANIFEST.sha256').read_text().splitlines():
              expected, name = line.split('  ', 1)
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          for name in ('iniciar_geforia.bat', 'iniciar_demo.bat'):
              data = Path(name).read_bytes()
              assert b'\r\n' in data and b'\n' not in data.replace(b'\r\n', b''), name
      - name: Ejecutar pruebas y lanzadores con datos temporales
        run: python -m unittest discover -s tests -v
